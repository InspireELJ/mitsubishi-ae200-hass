[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymelans"
version = "0.2.0b6"
description = "Async client for Mitsubishi Electric MELANS / AE-200 / EW-50 centralised HVAC controllers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GitDakky" }]
keywords = ["mitsubishi", "ae-200", "ew-50", "g-50", "melans", "hvac", "bms", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/InspireELJ/mitsubishi-ae200-hass"
Issues = "https://github.com/InspireELJ/mitsubishi-ae200-hass/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "voluptuous>=0.13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pymelans*"]

[tool.ruff]
line-length = 100
target-version = "py311"
